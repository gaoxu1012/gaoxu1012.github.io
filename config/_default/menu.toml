# ==========================================
# 左侧导航菜单配置
# ==========================================

# 菜单项 1：主页
[[main]]
  identifier = "home"             # 唯一标识符，不能重复
  name = "主页"                   # 菜单上显示的文本
  url = "/"                       # 链接地址
  weight = 1                      # 排序权重，数字越小越靠前
  [main.params]
    icon = "home"                 # 图标名称（对应 Tabler Icons 的图标，如 home, user, tags）

