
# ==========================================
# 侧边栏设置 (Sidebar)
# ==========================================
[sidebar]
  compact = false                 # 是否开启紧凑模式（开启后侧边栏会变窄，常用于宽屏）
  avatar = "img/avatar.png"       # 头像路径（请确保你的 assets/img/avatar.png 存在）
  # emoji = "🍎"                    # 显示在侧边栏签名旁边的 Emoji 表情
  subtitle = "言者所以在意，得意而忘言"      # 侧边栏副标题（会被 languages.toml 里的设置覆盖）

# ==========================================
# 全局文章设置 (Main Sections)
# ==========================================
mainSections = ["post","essays","shares"]                          # 指定哪个文件夹下的内容算作“文章”（默认是 content/post/）

# ==========================================
# 文章页面设置 (Article)
# ==========================================
[article]
  headingAnchor = true            # 是否在文章标题旁显示锚点（点击可生成该标题的链接）
  math = false                    # 是否全局开启数学公式支持（KaTeX，如果用不到建议关掉以提高加载速度）
  toc = true                      # 是否在文章右侧/侧边栏显示目录 (Table of Contents)
  readingTime = true              # 是否显示预计阅读时间
  
  # 文章底部的版权协议设置
  [article.license]
    enabled = false                # 开启版权声明
    default = "本文采用 CC BY-NC-SA 4.0 许可协议，转载请注明出处。" # 默认版权文本

# ==========================================
# 小部件设置 (Widgets)
# ==========================================
[widgets]
  # 首页（主页）显示的小部件（从上到下排列）
  homepage = [
    { type = "search" },                                  # 搜索框
    { type = "archives", params = { limit = 5 } },        # 归档（只显示最近 5 篇）
    { type = "categories", params = { limit = 10 } },     # 分类（只显示 10 个）
    { type = "tag-cloud", params = { limit = 20 } }       # 标签云（最多显示 20 个标签）
  ]
  
  # 文章详情页右侧/底部显示的小部件
  page = [
    { type = "toc" }                                      # 文章目录
  ]

# ==========================================
# 颜色模式 (Color Scheme)
# ==========================================
[colorScheme]
  toggle = true                   # 是否在页面右上角显示“深色/浅色模式”切换按钮
  default = "auto"                # 默认模式：可选 "light"（亮）、"dark"（暗）、"auto"（跟随系统）